<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百華爽太</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <h1>百華爽太</h1>
    <p>サイト改装中です。</p>

    <div class="sns">
      <a class="sns-link sns-tiktok" href="https://www.tiktok.com/@momoka_sota?_r=1&_t=ZS-97YVAzaqjYb" target="_blank">TikTok</a>
      <a class="sns-link sns-x" href="https://x.com/momoka_sota100?s=11&t=aL7fCxnq-a7y3-TNYRUa5g" target="_blank">X</a>
      <a class="sns-link sns-instagram" href="https://www.instagram.com/sota100days?igsh=eHYyNzhzOTU4NnV1&utm_source=qr" target="_blank">Instagram</a>
    </div>
    <nav class="site-links">
      <a class="site-link" href="site-hyakka-sota/index.html">百華爽太</a>
      <a class="site-link" href="site-works/index.html">作品</a>
      <a class="site-link" href="site-dev/index.html">開発</a>
    </nav>
  </main>

  <section class="controls">
    <div class="preview-card">
      <img id="selected-icon" src="images/dev/portrait/IMG_9494.JPG" alt="選択中の背景画像">
      <p id="selected-label">画像をクリックして背景を切り替えます</p>
    </div>

    <div class="thumbs" id="thumbs"></div>
  </section>

  <script src="script.js"></script>
  <script>
    (function(){
      const backgrounds = [
        'images/dev/portrait/IMG_9494.JPG',
        'images/dev/portrait/IMG_9495.JPG',
        'images/dev/portrait/IMG_9496.JPG'
      ];

      function pickRandom(prev){
        if (!prev) return backgrounds[Math.floor(Math.random()*backgrounds.length)];
        const others = backgrounds.filter(b => b !== prev);
        return others[Math.floor(Math.random()*others.length)];
      }

      // set initial random background on load
      let current = backgrounds[Math.floor(Math.random()*backgrounds.length)];
      document.body.style.backgroundImage = `url('${current}')`;
      const selectedIcon = document.getElementById('selected-icon');
      if (selectedIcon) selectedIcon.src = current;

      // rotate every 5s
      setInterval(()=>{
        current = pickRandom(current);
        document.body.style.backgroundImage = `url('${current}')`;
        if (selectedIcon) selectedIcon.src = current;
      }, 5000);
    })();
  </script>
</body>
</html>
