<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百華爽太</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-img-root="images/home">
  <div id="bg-wrap">
    <div class="bg-layer" id="bg1"></div>
    <div class="bg-layer" id="bg2"></div>
  </div>
  <main class="hero">
    <h1>百華爽太</h1>
    <p>サイト改装中です。</p>

    <div class="sns">
      <a class="sns-link sns-tiktok" href="https://www.tiktok.com/@momoka_sota?_r=1&_t=ZS-97YVAzaqjYb" target="_blank">TikTok</a>
      <a class="sns-link sns-x" href="https://x.com/momoka_sota100?s=11&t=aL7fCxnq-a7y3-TNYRUa5g" target="_blank">X</a>
      <a class="sns-link sns-instagram" href="https://www.instagram.com/sota100days?igsh=eHYyNzhzOTU4NnV1&utm_source=qr" target="_blank">Instagram</a>
    </div>
    <nav class="site-links">
      <a class="site-link" href="site-hyakka-sota/index.html">百華爽太</a>
      <a class="site-link" href="site-works/index.html">作品</a>
      <a class="site-link" href="site-dev/index.html">開発</a>
    </nav>
  </main>

  <section class="controls">
    <div class="preview-card">
      <img id="selected-icon" src="images/home/portrait/IMG_9494.JPG" alt="選択中の背景画像">
      <p id="selected-label">画像をクリックして背景を切り替えます</p>
    </div>

    <div class="thumbs" id="thumbs"></div>
  </section>

  <script src="script.js"></script>
  <script>
    (function(){
      const base = (document.body && document.body.dataset && document.body.dataset.imgRoot) ? document.body.dataset.imgRoot : 'images/home';
      const backgrounds = [
        `${base}/portrait/12.png`,
        `${base}/portrait/4.png`
      ];
      const layerA = document.getElementById('bg1');
      const layerB = document.getElementById('bg2');
      let visibleA = true;
      function setLayer(el, url){ el.style.backgroundImage = `url('${url}')`; }
      function pickNext(current){ const others = backgrounds.filter(b=>b!==current); return others[Math.floor(Math.random()*others.length)]; }
      const selectedIcon = document.getElementById('selected-icon');
      let current = backgrounds[Math.floor(Math.random()*backgrounds.length)];
      setLayer(layerA, current); layerA.classList.add('show'); if(selectedIcon) selectedIcon.src = current;
      setInterval(()=>{
        const next = pickNext(current);
        const top = visibleA ? layerB : layerA;
        const bot = visibleA ? layerA : layerB;
        setLayer(top, next);
        top.classList.add('show');
        // after transition, hide bottom
        setTimeout(()=>{ bot.classList.remove('show'); }, 950);
        visibleA = !visibleA;
        current = next;
        if(selectedIcon) selectedIcon.src = current;
      }, 5000);
    })();
  </script>
</body>
</html>
