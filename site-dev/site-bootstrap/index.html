<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap実験</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="../../index.html">自己紹介</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarsExample">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html">開発</a></li>
          <li class="nav-item"><a class="nav-link" href="../site-play/index.html">お遊びサイト</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <section class="mb-5">
      <div class="alert alert-primary" role="alert">
        Bootstrapの機能を片っ端から試す実験場です。
      </div>
    </section>

    <section class="mb-5">
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card h-100 shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title">カード</h5>
              <p class="card-text">カードの見た目を試しています。</p>
              <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">モーダル</button>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100 shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title">バッジ</h5>
              <p class="card-text">新しい実験をしてみるときに使えそうです。</p>
              <span class="badge bg-success">Success</span>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100 shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title">ボタン</h5>
              <p class="card-text">色々なスタイルが簡単に作れます。</p>
              <button class="btn btn-outline-secondary demo-btn" data-demo-text="押した！">試す</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="mb-5">
      <div class="accordion" id="accordionExample">
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingOne">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
              アコーディオン1
            </button>
          </h2>
          <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
            <div class="accordion-body">
              ここは開閉できるコンテンツです。
            </div>
          </div>
        </div>
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingTwo">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
              アコーディオン2
            </button>
          </h2>
          <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#accordionExample">
            <div class="accordion-body">
              もう一つのアコーディオンです。
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="mb-5">
      <div class="row g-4 align-items-center">
        <div class="col-lg-6">
          <div class="progress mb-3" role="progressbar" aria-label="Basic example" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar" style="width: 60%"></div>
          </div>
          <div class="progress mb-3" role="progressbar" aria-label="Warning example" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar bg-warning" style="width: 80%"></div>
          </div>
          <div class="progress" role="progressbar" aria-label="Success example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar bg-success" style="width: 100%"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="d-flex align-items-center mb-3">
            <h4 class="mb-0">クリック反応</h4>
            <span class="status-pill" id="reactionStatus">待機中</span>
          </div>
          <div class="btn-group" role="group" aria-label="Basic example">
            <button type="button" class="btn btn-primary demo-action">Left</button>
            <button type="button" class="btn btn-primary demo-action">Center</button>
            <button type="button" class="btn btn-primary demo-action">Right</button>
          </div>
          <div class="mt-3">
            <button type="button" class="btn btn-danger demo-action">Danger</button>
            <button type="button" class="btn btn-info text-white demo-action">Info</button>
            <button type="button" class="btn btn-warning demo-action">Warning</button>
          </div>
        </div>
      </div>
    </section>

    <section class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">クリックで変わるリスト</h3>
        <button class="btn btn-success btn-sm" id="listToggleBtn">状態を切り替え</button>
      </div>
      <div class="list-group" id="demoListGroup">
        <a href="#" class="list-group-item list-group-item-action active" aria-current="true">アクティブ項目</a>
        <a href="#" class="list-group-item list-group-item-action">二番目</a>
        <a href="#" class="list-group-item list-group-item-action">三番目</a>
        <a href="#" class="list-group-item list-group-item-action">四番目</a>
      </div>
    </section>

    <section>
      <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body">
              これはBootstrapのtoastです。
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        </div>
      </div>
      <button type="button" class="btn btn-dark" id="toastBtn">Toastを表示</button>
    </section>
  </main>

  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">モーダル</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Bootstrapのモーダルの確認です。
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
          <button type="button" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
